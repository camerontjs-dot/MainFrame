name: Publish MainFrame v0.3.0

on:
  push:
    branches:
      - ops/release-v0.3.0-20260910

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: camerontjs-dot/MainFrame
      RELEASE_SHA: 726f9d83126ce65f17224bc6599ce222b21b54ad
      RELEASE_TREE: 403de41eb3b5daa065caee1de53609998c7f2fdc
      TAG: v0.3.0
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: 726f9d83126ce65f17224bc6599ce222b21b54ad
          fetch-depth: 0

      - name: Reconfirm release identity and tag absence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          remote_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          test "$remote_main" = "$RELEASE_SHA"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/tmp/existing-tag.json 2>/dev/null; then
            echo "Refusing to reuse existing tag $TAG" >&2
            cat /tmp/existing-tag.json >&2
            exit 1
          fi
          echo "release_commit=$RELEASE_SHA"
          echo "release_tree=$RELEASE_TREE"

      - name: Create exact immutable version tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          ref_type="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.type)"
          ref_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
          test "$ref_type" = "commit"
          test "$ref_sha" = "$RELEASE_SHA"
          echo "tag=$TAG"
          echo "tag_commit=$ref_sha"

      - name: Prepare release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          MainFrame v0.3.0 publishes the lifecycle-first public reference implementation as an exact checkpoint.

          ## Changed

          - Lifecycle zones distinguish capture, ingest, durable knowledge, volatile state, bounded projects, standing operations, and archive.
          - `30_projects/` and `40_operations/` share fail-closed identity semantics. Duplicate slugs and missing README authority are rejected.
          - `40_operations/mainframe-process-eval/` exposes `MPE_PUBLIC_CORE_WITH_BOUNDED_PROFILE` with labelled synthetic cases and a bounded local-only `close --write` path.
          - Public Core CI exercises lifecycle identity, session routing, process evaluation, contract linting, ingest, and work-inventory CLI surfaces.
          - Public publication uses a fresh-tree positive-manifest boundary from private MainFrame rather than copying private Git history.

          ## Compatibility

          This is a pre-1.0 MINOR release because the supported public architecture and behavioral contract changed materially from v0.2.0. The v0.2.0 tag and release remain unchanged.

          The v0.3.0 public contract covers lifecycle directory semantics, shared project/operation identity, the documented public CLIs, the bounded MPE profile, synthetic examples, and public CI. Private knowledge and live state, real evaluation evidence, Workstation, the full private process-eval preflight pack, and operator-specific surfaces are outside this release.

          ## MindGraph

          MindGraph is deferred from v0.3.0. The current public MainFrame core is coherent without it. A bounded clean-environment qualification of the current standalone MindGraph source did not clear the package/test portability gate, so its implementation is not being copied into this release. Retrieval remains a nomination surface, not truth, lifecycle authority, or verification.

          Qualification record: https://github.com/camerontjs-dot/MainFrame/pull/2

          ## Verification

          Release commit: `726f9d83126ce65f17224bc6599ce222b21b54ad`

          Release tree: `403de41eb3b5daa065caee1de53609998c7f2fdc`

          Public Core CI: https://github.com/camerontjs-dot/MainFrame/actions/runs/34484872191

          That run completed with 72 tests passed, 3 subtests passed, and the public CLI smoke checks passing.

          ```bash
          git clone https://github.com/camerontjs-dot/MainFrame.git
          cd MainFrame
          git checkout v0.3.0
          ./bin/process-eval status --json
          python -m pytest tests 40_operations/mainframe-process-eval/tests -q
          ```

          ## Known limits

          - `session-open` fails closed when local `STATE.md` authority is absent.
          - The full private `process-eval preflight` environment is not claimed as publicly reproducible.
          - MindGraph and Workstation are not included in this release.
          - No private knowledge, live operational state, project evidence, or evaluation history is part of the public tree.
          EOF

      - name: Publish GitHub release from verified tag
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "v0.3.0 — Lifecycle-first public core" \
            --notes-file /tmp/release-notes.md

      - name: Verify published release
        run: |
          set -euo pipefail
          tag="$(gh release view "$TAG" --repo "$REPO" --json tagName --jq .tagName)"
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          prerelease="$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)"
          ref_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
          test "$tag" = "$TAG"
          test "$draft" = "false"
          test "$prerelease" = "false"
          test "$ref_sha" = "$RELEASE_SHA"
          gh release view "$TAG" --repo "$REPO" --json url,tagName,name,isDraft,isPrerelease
